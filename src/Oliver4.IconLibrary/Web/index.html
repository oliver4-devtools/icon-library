<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only the tool's own files may run. Blocks inline event handlers in any SVG read from the environment. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Oliver4 Icon Library</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-brand">
      <img src="img/logo.png" alt="Oliver4">
      <div>
        <div class="cap">OLIVER4</div>
        <div class="ttl">Icon Library <span class="for">for Dataverse</span></div>
      </div>
    </div>
    <div class="hdr-desc" title="Apply a Fluent UI icon to a Dataverse table in a few clicks: pick the solution, the table and the icon, then create or update the SVG web resource, point the table at it and publish.">Apply a Fluent UI icon to a Dataverse table in a few clicks: pick the solution, the table and the icon, then create or update the SVG web resource, point the table at it and publish.</div>
    <div class="hdr-actions">
      <button class="btn-ghost" id="btnReload" title="Reload the solution list from the environment">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2.5A5.5 5.5 0 0 0 2.5 8a.5.5 0 0 1-1 0 6.5 6.5 0 0 1 11.2-4.5V2.5a.5.5 0 0 1 1 0V5a.5.5 0 0 1-.5.5h-2.5a.5.5 0 0 1 0-1h1.4A5.48 5.48 0 0 0 8 2.5Zm5.5 5a.5.5 0 0 1 1 0A6.5 6.5 0 0 1 3.3 12.5v1a.5.5 0 0 1-1 0V11a.5.5 0 0 1 .5-.5h2.5a.5.5 0 0 1 0 1H3.9A5.5 5.5 0 0 0 13.5 7.5Z"/></svg>
        Reload solutions
      </button>
      <button class="btn-ghost" id="btnAbout">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2Zm0 1a5 5 0 1 0 0 10A5 5 0 0 0 8 3Zm0 4a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3A.5.5 0 0 1 8 7Zm0-1.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z"/></svg>
        About
      </button>
    </div>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="body" id="body"></div>

  <div class="ftr">
    <div>&copy; <span id="ftrYear"></span> Oliver4 Icon Library</div>
    <div class="ftr-right">
      <div class="pill" id="connPill"><div class="dot"></div><span id="connText">Not connected</span></div>
      <div id="ftrVersion">v0.0.0</div>
    </div>
  </div>

  <div id="modalHost"></div>
  <div id="toastHost"></div>
</div>

<script src="app.js"></script>
</body>
</html>
